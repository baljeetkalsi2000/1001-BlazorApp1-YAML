# Name of the workflow as it appears in GitHub Actions UI
name: Build and Deploy (Az Login via Service Principal)

# Define when this workflow will run
on:
  workflow_dispatch: # Allow manual triggering from GitHub UI
  push:
    branches:
       - main # Run automatically when code is pushed to main branch
  
# Environment variables used throughout the workflow
env:
  AZURE_WEBAPP_NAME: time-service
  AZURE_WEBAPP_PACKAGE_PATH: './publish'
  DOTNET_VERSION: '6.x'
  SOLUTION_PATH: './BlazorApp1/BlazorApp1.sln'
  PROJECT_PATH: './BlazorApp1/BlazorApp1/BlazorApp1.csproj'
  PUBLISH_DIR: './publish'

#Azure OIDC-based Azure login
permissions:
  id-token: write
  contents: read

# Define the separate jobs that make up this workflow
jobs:
  # First job: build and test the application
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest # Use Ubuntu runner for this job

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      # - name: Test
      #   run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-restore --no-build --verbosity normal

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-restore --output ${{ env.PUBLISH_DIR }}

    # Store the published output as an artifact for later jobs
      - name: Publish Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webapp  # Name of the artifact
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

#1.Microsoft_Entra_App(App Registration and SP without Secrets)
  deploy_Microsoft_Entra_App:
    name: Download and Deploy to Azure - 1. Microsoft_Entra_App(App Registration and SP without Secrets)
    runs-on: ubuntu-latest
    needs: [build-and-test] # This job depends on the build-and-test job

    steps:
      # Retrieve the artifacts from the build job
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
      
          # 1. Log in to Azure completely passwordless using OIDC
      - name: Az CLI Login via Microsoft_Entra_App(App Registration and SP without Secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.MICROSOFT_ENTRA_APP_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.MICROSOFT_ENTRA_APP_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.MICROSOFT_ENTRA_APP_SUBSCRIPTION_ID }}

      # 2. Deploy your application files securely
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'DevopsNet'
          slot-name: 'Production'
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }} # Path to your built application files     
      
      - name: logout
        run: |
          az logout     

#2.Managed_Identity
  deploy_Managed_Identity:
    name: Download and Deploy to Azure - 2. Managed_Identity
    runs-on: ubuntu-latest
    needs: [deploy_Microsoft_Entra_App] #This job depends on the build-and-test job

    steps:
      # Retrieve the artifacts from the build job
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
      
          # 1. Log in to Azure completely passwordless using OIDC
      - name: Az CLI Login via Managed Identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.MANAGED_IDENTITY_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.MANAGED_IDENTITY_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.MANAGED_IDENTITY_AZURE_SUBSCRIPTION_ID }}

      # 2. Deploy your application files securely
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'DevopsNet'
          slot-name: 'Production'
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }} # Path to your built application files     
      
      - name: logout
        run: |
          az logout               

#3.Service_Principal (With Secrets and App Registration)
  deploy_Service_Principal:
    name: Download and Deploy to Azure - 3. Service_Principal (With Secrets and App Registration)
    runs-on: ubuntu-latest
    needs: [deploy_Managed_Identity] #This job depends on the build-and-test job

    steps:
      # Retrieve the artifacts from the build job
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
      
          # 1. Log in to Azure completely passwordless using OIDC
      - name: Az CLI Login via Service_Principal (With Secrets and App Registration)
        uses: azure/login@v2
        with:
          creds: ${{ vars.SERVICE_PRINCIPAL_SECRET_AZURE_CREDENTIALS_3 }}
          enable-AzPSSession: true           
          

      # 2. Deploy your application files securely
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'DevopsNet'
          slot-name: 'Production'
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }} # Path to your built application files     
      
      - name: logout
        run: |
          az logout        



  GetVariable:
    name: Get Variable
    runs-on: ubuntu-latest
    environment: Dev
    needs: [build-and-test] # This job depends on the build-and-test job

    steps:
      - name: Get Env Variable Data
        run: echo "Dev Environment Variable data ${{ vars.DEV_VAR }}"
      - name: Get Env From Action Secret
        run: echo "Action Variable data from ${{ vars.ACTION_GLOBAL_VAR }}"
      - name: Get Env From Repo Secret
        run: echo "Repo Secret ${{ secrets.ACTIONS_SECRETS}}"

          # 1. Log in to Azure completely passwordless using OIDC
      - name: Az CLI Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.MANAGED_IDENTITY_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.MANAGED_IDENTITY_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.MANAGED_IDENTITY_AZURE_SUBSCRIPTION_ID }}

      - name: Pull Vault Secrets
        uses: azure/get-keyvault-secrets@v1
        id: kv-secrets
        with:
          keyvault: 'KeyVaultDevOps-Git' # Replace with your Key Vault name
          secrets: |
            Secrets1              
      
      - name: logout
        run: |
          az logout    

